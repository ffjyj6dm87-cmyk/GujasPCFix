name: Windows build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build release
        run: msbuild GujasPCFix.csproj /p:Configuration=Release /p:Platform=AnyCPU
      - uses: actions/upload-artifact@v4
        with:
          name: GujasPCFix-Windows
          path: bin/Release/net48/GujasPCFix.exe
