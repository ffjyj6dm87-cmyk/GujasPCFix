name: Windows build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Restore dependencies
        run: msbuild GujasPCFix.csproj /t:Restore /p:Configuration=Release /p:Platform=AnyCPU
      - name: Build release
        run: msbuild GujasPCFix.csproj /p:Configuration=Release /p:Platform=AnyCPU
      - name: Verify catalog, backups and UI rendering
        shell: powershell
        run: ./tests/Verify.ps1
      - name: Name the tested executable
        shell: powershell
        run: Copy-Item bin/Release/net48/GujasPCFix.exe bin/Release/net48/GujasPCFix-2.1.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GujasPCFix-2.1-QA
          path: |
            qa/*.png
            qa/*.txt
            qa/*.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: GujasPCFix-2.1-Reference-Windows
          path: bin/Release/net48/GujasPCFix-2.1.exe
